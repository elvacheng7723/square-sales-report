name: Square Daily Sales Report

on:
  schedule:
    # 注意: GitHub Actions 的 cron 只能写 UTC 时间
    # 西澳(Perth)全年固定 UTC+8,不用夏令时,所以直接减8小时换算即可
    # 周一至周四 20:05 (Perth) = 12:05 UTC,对应 cron 星期几不变
    - cron: "5 12 * * 1-4"
    # 周五至周日 20:35 (Perth) = 12:35 UTC
    - cron: "35 12 * * 5,6,0"
  # 也支持在 GitHub 网页上手动点一下立刻跑一次,方便测试
  workflow_dispatch: {}

jobs:
  run-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限才能把报告commit回仓库
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 运行销售汇总脚本
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          DEBUG_TENDERS: "1"  # 临时调试开关,排查完Uber Eats/DoorDash识别问题后可以删掉这行
        run: node square_daily_test.js

      - name: 把生成的报告提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "没有新报告文件,跳过提交" || git commit -m "自动生成销售报告 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
